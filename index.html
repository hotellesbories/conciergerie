<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le Luberon des Bories</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Great+Vibes&family=Lato:wght@300;400;700&display=swap">
<style>
/* Layout: une colonne centrée façon livret d'accueil, en-tête monogramme + logotype, onglets sobres, filets dorés repris du logo. */
:root{
  --navy:#002a53;      /* bleu du logo */
  --navy-soft:#2c5078;
  --gold:#c6a65c;      /* filet doré du logo */
  --gold-pale:#efe5cc;
  --ink:#1c2633;
  --muted:#5d6977;
  --line:#dbe2ea;
  --mist:#f3f6f9;
  --paper:#ffffff;
  --f-display:"Cormorant Garamond", "Cormorant", Garamond, "Times New Roman", serif;
  --f-script:"Great Vibes", "Snell Roundhand", cursive;
  --f-body:"Lato", "Helvetica Neue", Arial, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-weight:300;font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:var(--navy)}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto;padding-inline:clamp(16px,4vw,40px)}

/* ---------- En-tête ---------- */
.topbar{display:flex;justify-content:space-between;align-items:center;padding-block:14px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.qr-box{display:flex;align-items:center;gap:12px}
.qr-box .qr{width:76px;height:76px;flex:none;border:1px solid var(--line)}
.qr-box > span{display:flex;flex-direction:column;gap:3px}
.qr-t{color:var(--muted)}
.qr-l{text-transform:none;letter-spacing:.02em;font-size:12.5px;color:var(--navy);max-width:13rem;line-height:1.35}
@media (max-width:560px){.qr-box .qr{width:56px;height:56px}.qr-l{display:none}}
.lang{display:flex;gap:2px;align-items:center}
.lang button{background:none;border:0;cursor:pointer;padding:6px 8px;font-size:12px;letter-spacing:.14em;color:var(--muted)}
.lang button[aria-pressed="true"]{color:var(--navy);font-weight:700}
.lang span{color:var(--line)}
header.brand{text-align:center;padding-block:18px 34px}
.mono{width:74px;height:auto;display:block;margin:0 auto 18px}
.wordmark{width:min(340px,84%);height:auto;display:block;margin:0 auto}
.place{margin-top:14px;font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--navy)}
.intro{max-width:36rem;margin:26px auto 0;font-family:var(--f-display);font-size:clamp(20px,2.4vw,24px);line-height:1.45;color:var(--ink);text-wrap:balance}
.intro em{font-style:italic;color:var(--navy)}

/* ---------- Onglets ---------- */
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.tablist{display:flex;justify-content:center;gap:clamp(4px,3vw,44px);overflow-x:auto;scrollbar-width:none}
.tablist::-webkit-scrollbar{display:none}
.tab{background:none;border:0;cursor:pointer;padding:18px 6px 16px;font-size:12.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-weight:400}
.tab:hover{color:var(--navy)}
.tab[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--gold);font-weight:700}

/* ---------- Sections ---------- */
main{padding-block:44px 70px}
.panel-head{text-align:center;margin-bottom:34px}
.script{font-family:var(--f-script);color:var(--gold);font-size:clamp(34px,5vw,46px);line-height:1;font-weight:400}
h2{font-family:var(--f-display);font-weight:500;font-size:clamp(28px,3.6vw,38px);color:var(--navy);margin:6px 0 0;letter-spacing:.01em;text-wrap:balance}
.rule{display:flex;align-items:center;justify-content:center;gap:14px;margin:18px auto 0;color:var(--gold)}
.rule::before,.rule::after{content:"";width:46px;height:1px;background:var(--gold)}
.rule i{width:5px;height:5px;border:1px solid var(--gold);transform:rotate(45deg)}
.lede{max-width:40rem;margin:18px auto 0;color:var(--muted);text-wrap:pretty}
h3{font-family:var(--f-display);font-weight:500;font-size:26px;color:var(--navy);margin:0;line-height:1.2}
.eyebrow{font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:700}
.small{font-size:13.5px;color:var(--muted)}

/* ---------- Marchés ---------- */
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);margin-bottom:30px}
.day{background:var(--paper);border:0;border-left:1px solid var(--line);padding:22px 4px 12px;cursor:pointer;text-align:center;position:relative}
.day:first-child{border-left:0}
.day .d-long{display:block;font-family:var(--f-display);font-size:20px;color:var(--ink)}
.day .d-count{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.day .d-today{position:absolute;top:6px;left:50%;transform:translateX(-50%);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700}
.day[aria-selected="true"]{background:var(--navy)}
.day[aria-selected="true"] .d-long{color:#fff}
.day[aria-selected="true"] .d-count{color:#c9d5e3}
.day:hover:not([aria-selected="true"]){background:var(--mist)}
.day .d-short{display:none}
@media (max-width:640px){.day .cw{display:none}.day .d-today{font-size:0;width:6px;height:6px;border-radius:50%;background:var(--gold);top:8px}.day .d-long{display:none}.day .d-short{display:block;font-family:var(--f-display);font-size:19px}.day .d-count{font-size:10px;letter-spacing:.05em}.day[aria-selected="true"] .d-short{color:#fff}}
.mk-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:44px;align-items:start}
@media (max-width:860px){.mk-grid{grid-template-columns:1fr}}
.mk-dayname{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--navy);padding-bottom:10px;flex-wrap:wrap}
.mk-dayname h3{font-size:30px}
.market{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 18px;padding:18px 0;border-bottom:1px solid var(--line)}
.market .v{font-family:var(--f-display);font-size:23px;color:var(--navy);line-height:1.2}
.market .when{font-size:14px;color:var(--ink)}
.market .note{grid-column:1/-1;font-size:14px;color:var(--muted);margin-top:-2px}
.market .dist{text-align:right;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.market .dist b{display:block;font-family:var(--f-display);font-size:22px;font-weight:500;color:var(--ink);line-height:1.1}
.tags{display:inline-flex;gap:6px;flex-wrap:wrap;margin-left:8px;vertical-align:3px}
.tag{font-family:var(--f-body);font-size:10px;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--line);padding:2px 7px;color:var(--muted);font-weight:400}
.tag.fav{border-color:var(--gold);color:#8a6d2a}
.tag.farm{border-color:#b9c9da;color:var(--navy-soft)}
.off .v,.off .when{color:#8a96a3}
.off-head{margin-top:30px;font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.aside{border:1px solid var(--line);padding:26px 24px;background:var(--mist)}
.aside h4{font-family:var(--f-display);font-weight:500;font-size:22px;color:var(--navy);margin:6px 0 10px}
.aside p{margin:0 0 12px;font-size:14.5px}
.aside ul{margin:0;padding:0;list-style:none}
.aside li{padding:8px 0;border-top:1px solid var(--line);font-size:14.5px}
.aside li b{font-weight:700;color:var(--navy)}

/* ---------- Carte ---------- */
.route-switch{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:0 auto 28px}
.route-switch button{background:var(--paper);border:1px solid var(--navy);padding:11px 18px;cursor:pointer;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--navy)}
.route-switch button:hover{background:var(--mist)}
.route-switch button[aria-pressed="true"]{background:var(--navy);color:#fff}
@media (max-width:560px){.route-switch{display:grid;grid-template-columns:1fr 1fr}.route-switch button{padding:10px 8px;font-size:10.5px;letter-spacing:.08em}}
.cal-intro{max-width:44rem;margin:0 auto;text-align:center}
.cal-intro p{margin:10px 0 0}
.map-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:36px;align-items:start}
@media (max-width:860px){.map-grid{grid-template-columns:1fr}}
.map-frame{border:1px solid var(--line);background:#fbfcfd;position:relative}
.map-frame svg{display:block;width:100%;height:auto}
.map-caption{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);background:var(--paper)}
.map-legend{display:flex;gap:16px;flex-wrap:wrap}
.map-legend span{display:inline-flex;align-items:center;gap:6px}
.lg-line{width:22px;height:0;border-top:2px solid var(--navy)}
.lg-velo{width:22px;height:0;border-top:2px dashed var(--gold)}
.lg-dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--navy);background:#fff}
svg text{paint-order:stroke;stroke:#fbfcfd;stroke-width:5px;stroke-linejoin:round}
svg .stop text:first-of-type{stroke:none}
svg .lbl{font-family:var(--f-display);font-size:23px;fill:var(--ink)}
svg .lbl-strong{font-family:var(--f-display);font-size:25px;font-weight:600;fill:var(--navy)}
svg .lbl-geo{font-family:var(--f-display);font-style:italic;font-size:21px;fill:#7b8b9c;letter-spacing:.06em}
svg .lbl-water{font-family:var(--f-display);font-style:italic;font-size:19px;fill:#5d86ad}
svg .stop{cursor:pointer}
svg .stop circle{transition:r .15s}
svg .stop:hover circle.ring,svg .stop.on circle.ring{stroke:var(--gold);stroke-width:3}
.stops{margin:0;padding:0;list-style:none;counter-reset:s}
.stops-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--navy);padding-bottom:10px;margin-bottom:4px}
.stops-head h3{font-size:26px}
.stop-item{display:grid;grid-template-columns:34px minmax(0,1fr);gap:4px 14px;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%;font:inherit;color:inherit}
.stop-item:hover,.stop-item.on{background:var(--mist)}
.stop-num{width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-size:17px;font-weight:600;margin-top:2px}
.stop-item .t{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.stop-item .n{font-family:var(--f-display);font-size:21px;color:var(--navy)}
.stop-item .h{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.stop-item p{margin:2px 0 0;font-size:14.5px}
.stop-item .mk{font-size:12.5px;color:#8a6d2a;margin-top:4px}
.btn{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--navy);padding:12px 20px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;color:var(--navy);background:var(--paper)}
.btn:hover{background:var(--navy);color:#fff}
.btn-row{margin-top:20px;display:flex;gap:12px;flex-wrap:wrap}

/* ---------- Cartes villages / activités ---------- */
.section-sep{margin:70px 0 34px;text-align:center}
.vgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 48px}
@media (max-width:760px){.vgrid{grid-template-columns:1fr}}
.village{padding:24px 0;border-top:1px solid var(--line)}
.village .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.village .km{font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.village p{margin:8px 0 0}
.village .must{margin-top:10px;font-size:14px;color:var(--muted)}
.village .must b{color:var(--navy);font-weight:700;font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin-right:6px}
.triangle{display:grid;grid-template-columns:auto minmax(0,1fr);gap:26px;align-items:center;max-width:760px;margin:0 auto 46px;padding:26px 28px;border:1px solid var(--gold-pale);background:linear-gradient(var(--paper),var(--paper)) padding-box}
.triangle svg{width:104px;height:auto}
.triangle p{margin:6px 0 0}
@media (max-width:560px){.triangle{grid-template-columns:1fr;text-align:center}.triangle svg{margin:0 auto}}

.chips{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-bottom:34px}
.chip{background:var(--paper);border:1px solid var(--line);padding:8px 16px;cursor:pointer;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--navy);color:var(--navy);font-weight:700}
.agrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 48px}
@media (max-width:760px){.agrid{grid-template-columns:1fr}}
.act{padding:24px 0;border-top:1px solid var(--line)}
.act h3{font-size:24px;margin-top:4px}
.act p{margin:8px 0 0}
.act .meta{margin-top:10px;font-size:13px;color:var(--muted);display:flex;gap:6px 18px;flex-wrap:wrap}
.twocol{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;margin-top:56px}
@media (max-width:760px){.twocol{grid-template-columns:1fr}}
.twocol ul{margin:0;padding:0;list-style:none}
.twocol li{padding:9px 0;border-top:1px solid var(--line);font-size:14.5px}
.twocol li b{font-weight:700;color:var(--navy)}
.fac h3 .tel{margin-left:8px;font-size:14px;color:#8a6d2a;vertical-align:3px}
.resto{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:44px;align-items:start;padding-top:10px}
@media (max-width:820px){.resto{grid-template-columns:1fr;gap:28px}}
.resto h3{font-size:clamp(28px,3.4vw,36px);margin-top:6px}
.resto .chefs{margin:10px 0 0;font-size:14px;color:#8a6d2a;letter-spacing:.02em}
.resto p{margin:14px 0 0}
.resto .aside h4{margin-top:0}
.hours{margin:0;padding:0;list-style:none}
.hours li{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px}
.hours li span:last-child{font-variant-numeric:tabular-nums;color:var(--navy);font-weight:700;white-space:nowrap}
.resto .note{font-size:13.5px;color:var(--muted);margin-top:14px}
.btn-col{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.btn-col .btn{justify-content:center;text-align:center}
.btn.solid{background:var(--navy);color:#fff}
.btn.solid:hover{background:var(--navy-soft)}
.also{margin-top:60px;padding-top:26px;border-top:1px solid var(--navy)}
.also-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px;margin-top:16px}
@media (max-width:760px){.also-grid{grid-template-columns:1fr}}
.also-grid h4{margin:0 0 6px;font-family:var(--f-display);font-weight:500;font-size:21px;color:var(--navy)}
.also-grid p{margin:0;font-size:14.5px}
.see-hotel{text-align:center;margin:-10px auto 34px;font-size:14.5px;color:var(--muted)}
.linklike{background:none;border:0;padding:0;cursor:pointer;font:inherit;color:var(--navy);text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:3px}
.hotel-box{border:1px solid var(--navy);padding:30px clamp(20px,4vw,40px);margin-bottom:40px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:30px;align-items:center}
@media (max-width:760px){.hotel-box{grid-template-columns:1fr}}
.hotel-box ul{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 24px}
@media (max-width:480px){.hotel-box ul{grid-template-columns:1fr}}
.hotel-box li{padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.tel{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-body);font-size:.8em;font-weight:700;letter-spacing:.04em;color:var(--navy);white-space:nowrap;vertical-align:1px}
.hotel-box li b .tel{margin-left:8px;font-size:13px;color:#8a6d2a}
.delivery .tel,footer .tel{color:inherit}
.spa-links{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:6px}
.spa-link{color:var(--navy);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--gold);white-space:nowrap}
.spa-link:hover{color:#8a6d2a}
.hotel-box li b{display:block;font-family:var(--f-display);font-weight:500;font-size:19px;color:var(--navy)}
.warn{max-width:760px;margin:40px auto 0;padding:18px 22px;border-left:2px solid var(--gold);background:var(--mist);font-size:14.5px}

/* ---------- Vélo ---------- */
.delivery{background:var(--navy);color:#fff;padding:clamp(26px,4vw,42px);display:grid;grid-template-columns:auto minmax(0,1fr);gap:30px;align-items:center;margin-bottom:46px}
.delivery img{width:66px;height:auto}
.delivery .eyebrow{color:var(--gold)}
.delivery h3{color:#fff;font-size:clamp(26px,3vw,32px);margin-top:4px}
.delivery p{margin:10px 0 0;color:#dbe4ee;max-width:46rem}
.delivery.solo{grid-template-columns:1fr}
@media (max-width:560px){.delivery{grid-template-columns:1fr}.delivery img{width:54px}}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--navy);border-bottom:1px solid var(--line);margin:30px 0 40px}
@media (max-width:700px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fact{padding:18px 12px;text-align:center;border-left:1px solid var(--line)}
.fact:first-child{border-left:0}
@media (max-width:700px){.fact:nth-child(3){border-left:0}.fact:nth-child(n+3){border-top:1px solid var(--line)}}
.fact b{display:block;font-family:var(--f-display);font-weight:500;font-size:34px;color:var(--navy);line-height:1.1;font-variant-numeric:tabular-nums}
.fact span{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.rides{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 48px;margin-top:20px}
@media (max-width:760px){.rides{grid-template-columns:1fr}}
.ride{padding:24px 0;border-top:1px solid var(--line)}
.ride.wide{grid-column:1/-1}
.ride.wide p{max-width:60rem}
.ride .lvl{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--muted)}
.ride .lvl b{color:var(--ink);font-weight:700}
.ride p{margin:8px 0 0}
.tips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;margin-top:46px}
@media (max-width:760px){.tips{grid-template-columns:1fr}}
.tips div{border-top:1px solid var(--gold);padding-top:14px;font-size:14.5px}
.tips h4{margin:0 0 6px;font-family:var(--f-display);font-weight:500;font-size:20px;color:var(--navy)}

/* ---------- Pied de page ---------- */
footer{border-top:1px solid var(--line);padding-block:44px;text-align:center;background:var(--mist)}
footer img{width:44px;margin:0 auto 14px;display:block}
footer .addr{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--navy)}
footer p{margin:6px 0 0;font-size:13.5px;color:var(--muted)}
.sources{font-size:12px;color:var(--muted);margin-top:16px}
.sources a{color:var(--muted)}
</style>

<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>

function T9(s){return s.replace(/\{TEL:(\d+)\}/g,function(a,n){return tel(n);});}
function renderHotel(){
  var F=[["16h",t("f_in")],["12h",t("f_out")],["24h/24",t("f_rec")],["Wi-Fi",t("f_wifi")]];
  document.getElementById("hotel-facts").innerHTML=F.map(function(f){return '<div class="fact"><b>'+f[0]+'</b><span>'+f[1]+'</span></div>';}).join("");
  document.getElementById("fac-list").innerHTML=FAC.map(function(f){
    return '<article class="act fac"><h3>'+L(f.n)+(f.tel?' '+tel(f.tel):'')+'</h3><p>'+L(f.t)+'</p>'+(f.links?'<span class="spa-links">'+f.links.map(function(k){return '<a class="spa-link" href="'+k.u+'" target="_blank" rel="noopener">'+L(k)+'</a>';}).join("")+'</span>':'')+'</article>';
  }).join("");
  document.getElementById("room-list").innerHTML=ROOM.map(function(r){return '<li>'+T9(L(r))+'</li>';}).join("");
  document.getElementById("serv-list").innerHTML=SERV.map(function(r){return '<li>'+T9(L(r))+'</li>';}).join("");
}
/* ---------- Restaurants ---------- */
function renderRestos(){
  document.getElementById("resto-switch").innerHTML=RESTOS.map(function(r){return '<button type="button" id="rs-'+r.id+'" data-resto="'+r.id+'" aria-pressed="'+(r.id===resto)+'">'+L(r.tab)+'</button>';}).join("");
  var r=RESTOS.filter(function(x){return x.id===resto;})[0];
  var hrs='<ul class="hours">'+r.h.map(function(h){return '<li><span>'+L(h[0])+'</span><span>'+L(h[1])+'</span></li>';}).join("")+'</ul>';
  var pr=r.p?'<h4 style="margin-top:22px">'+t("re_prices")+'</h4><ul class="hours">'+r.p.map(function(h){return '<li><span>'+L(h[0])+'</span><span>'+(typeof h[1]==="string"?h[1]:L(h[1]))+'</span></li>';}).join("")+'</ul>':'';
  var links=r.links.length?'<div class="btn-col">'+r.links.map(function(k){return '<a class="btn'+(k.solid?' solid':'')+'" href="'+k.u+'" target="_blank" rel="noopener">'+L(k)+' ↗</a>';}).join("")+'</div>':'';
  document.getElementById("resto-panel").innerHTML='<div><div class="eyebrow">'+L(r.e)+'</div><h3>'+L(r.n)+'</h3>'+(r.chefs?'<p class="chefs">'+L(r.chefs)+'</p>':'')+'<p>'+L(r.t)+'</p></div>'+
    '<aside class="aside"><h4>'+t("re_hours")+'</h4>'+hrs+pr+(r.note?'<p class="note">'+T9(L(r.note))+'</p>':'')+links+'</aside>';
  document.getElementById("bar-list").innerHTML=BARS.map(function(b){return '<div><h4>'+L(b.n)+'</h4><p>'+L(b.t)+'</p></div>';}).join("");
}

/* ---------- Activités ---------- */
function renderActivities(){
  var cats=["all","her","nat","taste","sky","bike"];
  document.getElementById("chips").innerHTML=cats.map(function(c){return '<button type="button" class="chip" id="chip-'+c+'" data-cat="'+c+'" aria-pressed="'+(c===cat)+'">'+t("cat_"+c)+'</button>';}).join("");
  document.getElementById("act-list").innerHTML=A.filter(function(a){return cat==="all"||a.c===cat;}).map(function(a){
    return '<article class="act"><div class="eyebrow">'+t("cat_"+a.c)+'</div><h3>'+L(a.n)+'</h3><p>'+L(a.t)+'</p><div class="meta"><span>'+L(a.d)+'</span><span>'+L(a.s)+'</span></div></article>';
  }).join("");
}

/* ---------- Vélo ---------- */
function renderBike(){
  var svg=document.getElementById("map-velo"), r=BR[bike];
  var vr=[PL.cavaillon.c,PL.robion.c,P(5.122,43.858),PL.coustellet.c,P(5.186,43.857),PL.gare.c,PL.pontjulien.c,P(5.35,43.866),PL.apt.c];
  var raw=routeRaw(r), keys=r.stops.map(function(s){return s.k;});
  if(r.zoom) setZoom(raw,[200,120]); else setZoom(null);
  var g=baseMap();
  g+=villageDots(r.base||["senanque","gordes","roussillon","goult","bonnieux","lacoste","menerbes","oppede","isle","fontaine","lourmarin","cavaillon"],keys);
  g+='<path d="'+smooth(ZS(vr))+'" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>';
  g+='<path d="'+smooth(ZS(vr))+'" fill="none" stroke="#c6a65c" stroke-width="'+(bike==="velo"?4.2:3.2)+'" stroke-dasharray="10 6" stroke-linecap="round" opacity="'+(bike==="velo"?1:.55)+'"/>';
  if(bike==="velo"){ ["robion"].forEach(function(k){var p=PL[k],c=Z(p.c);
    g+='<circle cx="'+c[0].toFixed(1)+'" cy="'+c[1].toFixed(1)+'" r="6" fill="#c6a65c" stroke="#fff" stroke-width="2"/>';
    g+='<text class="lbl" x="'+(c[0]+p.dx).toFixed(1)+'" y="'+(c[1]+p.dy).toFixed(1)+'" text-anchor="'+p.a+'">'+esc(nm(p))+'</text>';});}
  g+= bike==="velo" ? routeLine(ZS([PL.hotel.c,P(5.180,43.900),P(5.160,43.885),PL.coustellet.c])) : routeLine(ZS(raw));
  g+=hotelMark();
  g+=stopMarks(r);
  svg.innerHTML=g;
  document.getElementById("bike-title").textContent=L(r.title);
  document.getElementById("bike-meta").textContent=L(r.meta);
  document.getElementById("bike-stops").innerHTML=stopsHTML(r,false);
  document.getElementById("bike-note").textContent=L(r.note);
  document.querySelectorAll("#bike-switch button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.bike===bike);});
  var F=[["34",t("f1")],["89 %",t("f2")],["163 m",t("f3")],["2 000",t("f4")]];
  document.getElementById("facts").innerHTML=F.map(function(f){return '<div class="fact"><b>'+f[0]+'</b><span>'+f[1]+'</span></div>';}).join("");
  document.getElementById("ride-list").innerHTML=RIDES.map(function(r){
    return '<article class="ride'+(r.wide?' wide':'')+'"><h3>'+L(r.n)+'</h3><p>'+L(r.t)+'</p><div class="lvl"><span><b>'+t("dist")+'</b> '+L(r.km)+'</span><span><b>'+t("level")+'</b> '+L(r.l)+'</span><span><b>'+t("from")+'</b> '+r.f+'</span></div></article>';
  }).join("");
  document.getElementById("tips").innerHTML=[1,2,3].map(function(i){return '<div><h4>'+t("tips_t"+i)+'</h4>'+t("tips_"+i)+'</div>';}).join("");
}

/* ---------- Onglets ---------- */
function showPanel(p,push){
  panel=p;
  document.querySelectorAll(".tab").forEach(function(b){b.setAttribute("aria-selected",b.dataset.panel===p);});
  document.querySelectorAll("[role=tabpanel]").forEach(function(s){s.hidden=s.id!==p;});
  if(push){ try{history.replaceState(null,"","#"+p);}catch(e){} store("bories-tab",p); }
}
function renderAll(){renderStatic();renderHotel();renderRestos();renderMarkets();renderRouteMap();renderVillages();renderActivities();renderBike();}

/* ---------- Événements ---------- */
document.addEventListener("click",function(e){
  var b;
  if((b=e.target.closest(".tab"))){showPanel(b.dataset.panel,true);var nav=document.querySelector("nav.tabs");if(window.scrollY>nav.offsetTop) window.scrollTo({top:nav.offsetTop,behavior:"smooth"});return;}
  if((b=e.target.closest(".lang button"))){lang=b.dataset.lang;store("bories-lang",lang);renderAll();return;}
  if((b=e.target.closest(".day"))){day=+b.dataset.day;renderMarkets();document.getElementById("day-"+day).focus();return;}
  if((b=e.target.closest("#route-switch button"))){route=b.dataset.route;renderRouteMap();return;}
  if((b=e.target.closest(".chip"))){cat=b.dataset.cat;renderActivities();return;}
  if((b=e.target.closest("#resto-switch button"))){resto=b.dataset.resto;renderRestos();return;}
  if((b=e.target.closest("[data-goto]"))){showPanel(b.dataset.goto,true);var nv=document.querySelector("nav.tabs");window.scrollTo({top:nv.offsetTop,behavior:"smooth"});return;}
  if((b=e.target.closest("#bike-switch button"))){bike=b.dataset.bike;renderBike();return;}
  if((b=e.target.closest(".stop-item"))){highlight(+b.dataset.i,b.closest("[data-scope]").dataset.scope);return;}
  if((b=e.target.closest("svg .stop"))){var i=+b.dataset.i,sc=b.closest("#map-velo")?"velo":"villages";highlight(i,sc);return;}
});
document.addEventListener("mouseover",function(e){var s=e.target.closest(".stop-item,svg .stop");if(!s) return;var sc=s.closest("#map-velo,#bike-stops")?"velo":"villages";highlight(+s.dataset.i,sc);});

/* ---------- Démarrage ---------- */
var sl=store("bories-lang");
lang = sl==="en"||sl==="fr" ? sl : ((navigator.language||"fr").slice(0,2)==="fr"?"fr":"en");
var hash=(location.hash||"").replace("#","");
var st=store("bories-tab");
var PANELS=["hotel","restaurants","marches","villages","activites","velo"];
var start=PANELS.indexOf(hash)>-1?hash:(PANELS.indexOf(st)>-1?st:"hotel");
renderAll();
showPanel(start,false);
})();

</script>

</body>
</html>
